esphome:
  name: sovereign-telemetry-bridge
  friendly_name: Sovereign Mini Datacenter Telemetry Bridge

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  baud_rate: 0

api:

ota:
  - platform: esphome

# Prometheus metrics endpoint on port 80/metrics
prometheus:
  include_internal: false

# MQTT Auto-Discovery for Home Assistant integration
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: sovereign/telemetry

# I2C Bus for OLED Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# SSD1306 128x64 OLED Status Display
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 2s
    id: oled_display
    pages:
      - id: page_power
        lambda: |-
          it.printf(0, 0, id(font_title), "SOVEREIGN DC");
          it.printf(0, 16, id(font_body), "Batt: %.1f V", id(battery_voltage).state);
          it.printf(0, 28, id(font_body), "SoC:  %.0f %%", id(battery_soc).state);
          it.printf(0, 40, id(font_body), "Solar: %.0f W", id(solar_power).state);
          it.printf(0, 52, id(font_body), "I: %.1f A", id(battery_current).state);
      - id: page_thermal
        lambda: |-
          it.printf(0, 0, id(font_title), "THERMAL");
          it.printf(0, 16, id(font_body), "Intake:  %.1f C", id(coolant_intake).state);
          it.printf(0, 28, id(font_body), "Exhaust: %.1f C", id(coolant_exhaust).state);
          it.printf(0, 40, id(font_body), "Delta:   %.1f C", id(coolant_exhaust).state - id(coolant_intake).state);
          it.printf(0, 52, id(font_body), "Uptime: %.0fs", id(uptime_sensor).state);
      - id: page_status
        lambda: |-
          it.printf(0, 0, id(font_title), "STATUS");
          if (id(wifi_connected).state) {
            it.printf(0, 16, id(font_body), "WiFi: ONLINE");
            it.printf(0, 28, id(font_body), "RSSI: %.0f dBm", id(wifi_signal).state);
          } else {
            it.printf(0, 16, id(font_body), "WiFi: OFFLINE");
          }
          if (id(mqtt_connected).state) {
            it.printf(0, 40, id(font_body), "MQTT: CONNECTED");
          } else {
            it.printf(0, 40, id(font_body), "MQTT: DISCONNECTED");
          }

# Fonts for OLED display
font:
  - file: "gfonts://Roboto Mono"
    id: font_title
    size: 12
  - file: "gfonts://Roboto Mono"
    id: font_body
    size: 10

# OLED page cycling interval
interval:
  - interval: 5s
    then:
      - display.page.show_next: oled_display
      - component.update: oled_display

# Status LED (GPIO2 - built-in blue LED)
light:
  - platform: status_led
    name: "Status LED"
    pin: GPIO2

# 1-Wire Coolant Temperature Probes
one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  - platform: dallas_temp
    address: 0x28616410313398c8
    name: "Coolant Loop Intake Temp"
    id: coolant_intake
    unit_of_measurement: "°C"
    accuracy_decimals: 2

  - platform: dallas_temp
    address: 0x28616410313398c9
    name: "Radiator Exhaust Temp"
    id: coolant_exhaust
    unit_of_measurement: "°C"
    accuracy_decimals: 2

  # Victron VE.Direct MPPT Parser
  - platform: custom
    lambda: |-
      auto ve = new VEDirectCustomSensor();
      App.register_component(ve);
      return {ve->voltage_sensor, ve->current_sensor, ve->solar_power_sensor, ve->soc_sensor};
    sensors:
      - name: "Battery Voltage"
        id: battery_voltage
        unit_of_measurement: "V"
        accuracy_decimals: 2
      - name: "Battery Current"
        id: battery_current
        unit_of_measurement: "A"
        accuracy_decimals: 2
      - name: "Solar Harvest Power"
        id: solar_power
        unit_of_measurement: "W"
        accuracy_decimals: 0
      - name: "Battery SoC"
        id: battery_soc
        unit_of_measurement: "%"
        accuracy_decimals: 1

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal
    update_interval: 30s

  # Uptime Sensor
  - platform: uptime
    name: "Bridge Uptime"
    id: uptime_sensor
    update_interval: 60s

binary_sensor:
  # WiFi connection status
  - platform: status
    name: "Bridge Status"
    id: wifi_connected

  # MQTT connection status
  - platform: template
    name: "MQTT Connected"
    id: mqtt_connected
    lambda: |-
      return mqtt::global_mqtt_client->is_connected();

text_sensor:
  # ESPHome version
  - platform: version
    name: "ESPHome Version"

  # WiFi info
  - platform: wifi_info
    ip_address:
      name: "Bridge IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "Bridge MAC Address"

button:
  # Restart button
  - platform: restart
    name: "Restart Bridge"
