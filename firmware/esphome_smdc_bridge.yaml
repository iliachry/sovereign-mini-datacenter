esphome:
  name: sovereign-telemetry-bridge
  friendly_name: Sovereign Mini Datacenter Telemetry Bridge

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  baud_rate: 0

# Home Assistant native API (encrypted). Generate a key with:
#   openssl rand -base64 32
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Prometheus metrics endpoint on port 80/metrics
prometheus:
  include_internal: false

# MQTT Auto-Discovery for Home Assistant integration
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: sovereign/telemetry

# I2C Bus for OLED Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# SSD1306 128x64 OLED Status Display
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 2s
    id: oled_display
    pages:
      - id: page_power
        lambda: |-
          it.printf(0, 0, id(font_title), "SOVEREIGN DC");
          it.printf(0, 16, id(font_body), "Batt: %.1f V", id(battery_voltage).state);
          it.printf(0, 28, id(font_body), "SoC:  %.0f %%", id(battery_soc).state);
          it.printf(0, 40, id(font_body), "Solar: %.0f W", id(solar_power).state);
          it.printf(0, 52, id(font_body), "I: %.1f A", id(battery_current).state);
      - id: page_thermal
        lambda: |-
          it.printf(0, 0, id(font_title), "THERMAL");
          it.printf(0, 16, id(font_body), "Intake:  %.1f C", id(coolant_intake).state);
          it.printf(0, 28, id(font_body), "Exhaust: %.1f C", id(coolant_exhaust).state);
          it.printf(0, 40, id(font_body), "Delta:   %.1f C", id(coolant_exhaust).state - id(coolant_intake).state);
          it.printf(0, 52, id(font_body), "Uptime: %.0fs", id(uptime_sensor).state);
      - id: page_status
        lambda: |-
          it.printf(0, 0, id(font_title), "STATUS");
          if (id(wifi_connected).state) {
            it.printf(0, 16, id(font_body), "WiFi: ONLINE");
            it.printf(0, 28, id(font_body), "RSSI: %.0f dBm", id(wifi_rssi).state);
          } else {
            it.printf(0, 16, id(font_body), "WiFi: OFFLINE");
          }
          if (id(mqtt_connected).state) {
            it.printf(0, 40, id(font_body), "MQTT: CONNECTED");
          } else {
            it.printf(0, 40, id(font_body), "MQTT: DISCONNECTED");
          }

# Fonts for OLED display
font:
  - file: "gfonts://Roboto Mono"
    id: font_title
    size: 12
  - file: "gfonts://Roboto Mono"
    id: font_body
    size: 10

# Status LED (GPIO2 - built-in blue LED)
light:
  - platform: status_led
    name: "Status LED"
    pin: GPIO2

# 1-Wire Coolant Temperature Probes
one_wire:
  - platform: gpio
    pin: GPIO4

# Victron VE.Direct text-protocol UART (19200 8N1, optoisolated).
# Pinout matches firmware/esp32_telemetry_bridge.ino (RX=GPIO16, TX=GPIO17).
uart:
  - id: uart_ve_direct
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 19200
    rx_buffer_size: 512

globals:
  # Accumulates one VE.Direct line (LABEL<TAB>VALUE) between newlines.
  - id: ve_line
    type: std::string
    restore_value: false
    initial_value: '""'

# VE.Direct parser (replaces the removed ESPHome `platform: custom` sensor).
# Runs every 100 ms, drains the UART RX buffer and publishes parsed fields to
# the standard template sensors declared below.
interval:
  - interval: 100ms
    then:
      - lambda: |-
          auto publish = [](const std::string &label, const std::string &value) {
            const float v = atof(value.c_str());
            if (label == "V") {
              id(battery_voltage).publish_state(v / 1000.0f);       // mV  -> V
            } else if (label == "I") {
              id(battery_current).publish_state(v / 1000.0f);       // mA  -> A
            } else if (label == "PPV") {
              id(solar_power).publish_state(v);                     // W
            } else if (label == "SOC") {
              id(battery_soc).publish_state(v / 10.0f);             // ‰   -> %
            } else if (label == "VPV") {
              id(solar_voltage).publish_state(v / 1000.0f);         // mV  -> V
            } else if (label == "H20") {
              id(solar_yield_today).publish_state(v * 10.0f);       // 0.01 kWh -> Wh
            }
          };

          uint8_t byte;
          while (id(uart_ve_direct).available() && id(uart_ve_direct).read_byte(&byte)) {
            if (byte == '\n') {
              std::string &line = id(ve_line);
              // Strip a trailing carriage return, if present.
              if (!line.empty() && line.back() == '\r') {
                line.pop_back();
              }
              const size_t tab = line.find('\t');
              if (tab != std::string::npos && tab > 0) {
                publish(line.substr(0, tab), line.substr(tab + 1));
              }
              line.clear();
            } else if (id(ve_line).size() < 128) {
              id(ve_line).push_back(static_cast<char>(byte));
            } else {
              // Oversized frame (e.g. desynchronised HEX mode) — discard.
              id(ve_line).clear();
            }
          }

  # OLED page cycling
  - interval: 5s
    then:
      - display.page.show_next: oled_display
      - component.update: oled_display

sensor:
  - platform: dallas_temp
    address: 0x28616410313398c8
    name: "Coolant Loop Intake Temp"
    id: coolant_intake
    unit_of_measurement: "°C"
    accuracy_decimals: 2

  - platform: dallas_temp
    address: 0x28616410313398c9
    name: "Radiator Exhaust Temp"
    id: coolant_exhaust
    unit_of_measurement: "°C"
    accuracy_decimals: 2

  # Victron VE.Direct MPPT fields (published by the UART parser interval above)
  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    name: "Battery Current"
    id: battery_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    name: "Solar Harvest Power"
    id: solar_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Battery SoC"
    id: battery_soc
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Solar Array Voltage"
    id: solar_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    name: "Solar Yield Today"
    id: solar_yield_today
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: never

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: 30s

  # Uptime Sensor
  - platform: uptime
    name: "Bridge Uptime"
    id: uptime_sensor
    update_interval: 60s

binary_sensor:
  # WiFi connection status
  - platform: status
    name: "Bridge Status"
    id: wifi_connected

  # MQTT connection status
  - platform: template
    name: "MQTT Connected"
    id: mqtt_connected
    lambda: |-
      return mqtt::global_mqtt_client->is_connected();

text_sensor:
  # ESPHome version
  - platform: version
    name: "ESPHome Version"

  # WiFi info
  - platform: wifi_info
    ip_address:
      name: "Bridge IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "Bridge MAC Address"

button:
  # Restart button
  - platform: restart
    name: "Restart Bridge"
