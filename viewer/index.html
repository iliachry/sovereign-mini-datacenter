<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereign Mini Datacenter — 3D CAD Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050507; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    /* HUD Overlay */
    .hud-header {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(10, 10, 14, 0.85); backdrop-filter: blur(12px);
      padding: 16px 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
    }
    .hud-title { font-size: 18px; font-weight: 800; tracking-tight: -0.02em; }
    .hud-sub { font-size: 11px; font-family: monospace; color: #00ff66; margin-top: 4px; }
    
    .hud-controls {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 12px; background: rgba(10, 10, 14, 0.85); backdrop-filter: blur(12px);
      padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1);
    }
    .btn {
      background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 8px 16px;
      border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: #fff; color: #000; }
    .btn.active { background: #00ff66; color: #000; }

    .hud-telemetry {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      background: rgba(10, 10, 14, 0.85); backdrop-filter: blur(12px);
      padding: 16px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      font-family: monospace; font-size: 11px; width: 220px;
    }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .stat-val { font-weight: bold; color: #00ff66; }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div className="hud-header">
    <div className="hud-title">Sovereign Mini Datacenter</div>
    <div className="hud-sub">[ STATUS: PROTOTYPE CAD 3D VIEWER ]</div>
  </div>

  <div className="hud-telemetry">
    <div style="font-weight:bold; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:6px; margin-bottom:8px;">REAL-TIME TELEMETRY</div>
    <div className="stat-row"><span>DGX GPU TEMP:</span><span className="stat-val">38.4 °C</span></div>
    <div className="stat-row"><span>COOLANT TEMP:</span><span className="stat-val">28.1 °C</span></div>
    <div className="stat-row"><span>SOLAR INVERTER:</span><span className="stat-val">1.28 kW</span></div>
    <div className="stat-row"><span>BATTERY SOC:</span><span className="stat-val">98.5 %</span></div>
    <div className="stat-row"><span>UI LATENCY:</span><span className="stat-val">0.00 ms</span></div>
  </div>

  <div className="hud-controls">
    <button className="btn active" id="btn-assembled" onclick="setAssembly(false)">Assembled View</button>
    <button className="btn" id="btn-exploded" onclick="setAssembly(true)">Exploded View</button>
    <button className="btn" onclick="toggleRotate()">Toggle Auto-Rotate</button>
  </div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls;
    let dgxGroup1, dgxGroup2, batteryGroup, radiatorGroup, chassisMesh;
    let isExploded = false;
    let autoRotate = true;

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050507);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(2.5, 2.0, 3.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      const greenLight = new THREE.PointLight(0x00ff66, 1.5, 10);
      greenLight.position.set(0, 0.5, 0);
      scene.add(greenLight);

      // Build 3D Datacenter Model
      buildModel();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function buildModel() {
      // Chassis (Semi-transparent obsidian enclosure)
      const chassisGeo = new THREE.BoxGeometry(1.2, 1.6, 1.2);
      const chassisMat = new THREE.MeshPhysicalMaterial({
        color: 0x111115, transparent: true, opacity: 0.4, roughness: 0.1, transmission: 0.6, thickness: 0.5
      });
      chassisMesh = new THREE.Mesh(chassisGeo, chassisMat);
      scene.add(chassisMesh);

      // Frame Edges
      const edgesGeo = new THREE.EdgesGeometry(chassisGeo);
      const edgesMat = new THREE.LineBasicMaterial({ color: 0x00ff66, linewidth: 2 });
      const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
      scene.add(wireframe);

      // DGX Spark Node 1
      dgxGroup1 = createDGXNode();
      dgxGroup1.position.set(0, 0.4, 0);
      scene.add(dgxGroup1);

      // DGX Spark Node 2
      dgxGroup2 = createDGXNode();
      dgxGroup2.position.set(0, 0.1, 0);
      scene.add(dgxGroup2);

      // Battery Bank
      batteryGroup = createBatteryBank();
      batteryGroup.position.set(0, -0.4, 0);
      scene.add(batteryGroup);

      // Radiator
      radiatorGroup = createRadiator();
      radiatorGroup.position.set(0, 0.6, -0.45);
      scene.add(radiatorGroup);
    }

    function createDGXNode() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.2, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x222226, metalness: 0.8, roughness: 0.2 })
      );
      group.add(body);

      // LED Strip
      const led = new THREE.Mesh(
        new THREE.BoxGeometry(0.85, 0.02, 0.02),
        new THREE.MeshBasicMaterial({ color: 0x00ff66 })
      );
      led.position.set(0, 0.08, 0.46);
      group.add(led);

      return group;
    }

    function createBatteryBank() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.35, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x18181c, metalness: 0.5, roughness: 0.4 })
      );
      group.add(body);
      return group;
    }

    function createRadiator() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.85, 0.25, 0.1),
        new THREE.MeshStandardMaterial({ color: 0x0a0a0d, metalness: 0.9, roughness: 0.1 })
      );
      group.add(body);
      return group;
    }

    function setAssembly(exploded) {
      isExploded = exploded;
      document.getElementById('btn-assembled').classList.toggle('active', !exploded);
      document.getElementById('btn-exploded').classList.toggle('active', exploded);
    }

    function toggleRotate() {
      autoRotate = !autoRotate;
    }

    function animate() {
      requestAnimationFrame(animate);

      if (autoRotate) {
        scene.rotation.y += 0.005;
      }

      // Smooth Exploded View Interpolation
      const targetY1 = isExploded ? 0.7 : 0.4;
      const targetY2 = isExploded ? 0.2 : 0.1;
      const targetYBat = isExploded ? -0.7 : -0.4;

      dgxGroup1.position.y += (targetY1 - dgxGroup1.position.y) * 0.1;
      dgxGroup2.position.y += (targetY2 - dgxGroup2.position.y) * 0.1;
      batteryGroup.position.y += (targetYBat - batteryGroup.position.y) * 0.1;

      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
  </script>
</body>
</html>
