version: '3.8'

services:

  # ─── LOCAL AI INFERENCE ENGINE (OLLAMA / vLLM) ───
  ollama-llm:
    image: ollama/ollama:latest
    container_name: sovereign_ollama_ai
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── CODE REPOSITORY & CI/CD (GITLAB CE) ───
  gitlab-ce:
    image: gitlab/gitlab-ce:latest
    container_name: sovereign_gitlab
    restart: always
    hostname: 'gitlab.sovereign.local'
    ports:
      - "8080:80"
      - "8443:443"
      - "2222:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

  # ─── PROJECT MANAGEMENT (OPENPROJECT) ───
  openproject:
    image: openproject/community:13
    container_name: sovereign_openproject
    restart: always
    ports:
      - "8081:80"
    volumes:
      - openproject_data:/var/openproject/assets

  # ─── SECURE STORAGE & COLLABORATION (NEXTCLOUD) ───
  nextcloud-hub:
    image: nextcloud:latest
    container_name: sovereign_nextcloud
    restart: always
    ports:
      - "8082:80"
    volumes:
      - nextcloud_data:/var/www/html

volumes:
  ollama_storage:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  openproject_data:
  nextcloud_data:
