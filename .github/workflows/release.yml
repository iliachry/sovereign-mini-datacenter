# ====================================================================
# Sovereign Mini Datacenter — Automated PyPI Release Pipeline
# ====================================================================
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build package and publish to PyPI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Must run from a tag (push, or workflow_dispatch with a tag selected)
      # whose name is "v" + the version in pyproject.toml.
      - name: Check tag matches pyproject version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Releases must be built from a tag, got ${GITHUB_REF}"
            exit 1
          fi
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version} (expected v${version})"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches pyproject version ${version}."

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and source tarball
        run: python -m build

      - name: Validate distribution artifacts
        run: twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
