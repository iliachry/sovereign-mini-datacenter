# ====================================================================
# Sovereign Mini Datacenter — CI & Deployment Pipeline
# ====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:

  # ── Job 1: Lint shell scripts ─────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Lint all shell scripts
        # SC2312: ignore invoke-separately-or-assign (pattern is intentional)
        run: |
          find software/ -name "*.sh" -type f -exec shellcheck -S warning -e SC2312 {} +

  # ── Job 2: Validate docker-compose stacks ────────────────────────
  compose-validate:
    name: Validate Docker Compose Stacks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate all compose stacks with env.example
        working-directory: software
        run: |
          cp env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f vpn/docker-compose.vpn.yml config --quiet
          docker compose -f backup/docker-compose.backup.yml config --quiet
          docker compose -f telemetry/docker-compose.telemetry.yml config --quiet
          echo "✅ All Docker Compose stacks validated successfully."

  # ── Job 3: Check env.example completeness ────────────────────────
  env-check:
    name: Env Example Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify env.example is non-empty and has expected keys
        run: |
          [ -s software/env.example ] || (echo "env.example is empty!" && exit 1)
          for key in ACME_EMAIL DOMAIN_TRAEFIK DOMAIN_VPN WEBUI_SECRET_KEY OPENPROJECT_SECRET \
                     NEXTCLOUD_ADMIN_PASSWORD VAULTWARDEN_ADMIN_TOKEN \
                     GRAFANA_ADMIN_PASSWORD SMTP_HOST OLLAMA_DEFAULT_MODEL RESTIC_REPOSITORY; do
            grep -q "^${key}=" software/env.example \
              || (echo "Missing key in env.example: ${key}" && exit 1)
          done
          echo "✅ env.example contains all required keys."

  # ── Job 4: Python Telemetry Exporter Syntax Check ────────────────
  python-lint:
    name: Python Telemetry Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and check python syntax
        run: |
          python -m py_compile software/telemetry/power_exporter.py
          echo "✅ Python power exporter syntax verified."

  # ── Job 5: OpenSCAD syntax check (with virtual display) ──────────
  scad-lint:
    name: OpenSCAD Syntax Check & STL Export
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and virtual framebuffer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad xvfb

      - name: Check rack_enclosure.scad syntax and export STL
        run: |
          mkdir -p docs/cad
          xvfb-run --auto-servernum openscad \
            --hardwarnings \
            --export-format binstl \
            -o docs/cad/rack_enclosure.stl \
            cad/rack_enclosure.scad
          echo "✅ OpenSCAD export succeeded: $(du -sh docs/cad/rack_enclosure.stl)"

  # ── Job 6: Deploy 3D CAD Viewer to GitHub Pages ──────────────────
  deploy-pages:
    name: Deploy 3D Viewer to GitHub Pages
    needs: [shellcheck, compose-validate, env-check, python-lint, scad-lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4