# ====================================================================
# Sovereign Mini Datacenter — CI & Deployment Pipeline
# ====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ── Job 1: Lint shell scripts ─────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Lint all shell scripts
        run: |
          find software/ -name "*.sh" -type f -exec shellcheck -S error {} +

  # ── Job 2: Validate docker-compose stacks ────────────────────────
  compose-validate:
    name: Validate Docker Compose Stacks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate all compose stacks with env.example
        working-directory: software
        run: |
          cp env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f vpn/docker-compose.vpn.yml config --quiet
          docker compose -f backup/docker-compose.backup.yml config --quiet
          docker compose -f telemetry/docker-compose.telemetry.yml config --quiet
          docker compose -f space/docker-compose.space.yml config --quiet
          docker compose -f agents/docker-compose.agents.yml config --quiet
          docker compose -f security/docker-compose.crowdsec.yml config --quiet
          echo "✅ All Docker Compose stacks validated successfully."

  # ── Job 3: Check env.example completeness ────────────────────────
  env-check:
    name: Env Example Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify env.example is non-empty and has expected keys
        run: |
          [ -s software/env.example ] || (echo "env.example is empty!" && exit 1)
          for key in ACME_EMAIL DOMAIN_TRAEFIK DOMAIN_VPN WEBUI_SECRET_KEY OPENPROJECT_SECRET \
                     NEXTCLOUD_ADMIN_PASSWORD VAULTWARDEN_ADMIN_TOKEN \
                     GRAFANA_ADMIN_PASSWORD SMTP_HOST OLLAMA_DEFAULT_MODEL RESTIC_REPOSITORY SPACE_EXPORTER_PORT; do
            grep -q "^${key}=" software/env.example \
              || (echo "Missing key in env.example: ${key}" && exit 1)
          done
          echo "✅ env.example contains all required keys."

  # ── Job 4: Python Telemetry & Space DTN Unit Tests ───────────────
  python-lint:
    name: Python Telemetry & Space Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run test suite
        run: |
          python -m py_compile software/telemetry/power_exporter.py
          python -m py_compile software/space/*.py software/space/dtn/*.py software/space/orbital/*.py software/space/transceiver/*.py
          python -m py_compile src/sovereign_dc/*.py
          
          # Test Space DTN Bundle Serialization and Look Angle calculations
          python -c "
          from software.space.dtn.bundle import Bundle, BundlePriority
          from software.space.orbital.propagator import GroundStation, SatelliteOrbit
          
          # Test DTN Bundle
          b = Bundle('dtn://node-1/test', 'dtn://ground/rx', b'HELLO SPACE', priority=BundlePriority.CRITICAL)
          serialized = b.serialize()
          b2 = Bundle.deserialize(serialized)
          assert b2.payload == b'HELLO SPACE', 'Payload mismatch'
          assert b2.priority == BundlePriority.CRITICAL, 'Priority mismatch'
          
          # Test Orbital Look Angles
          gs = GroundStation('Test-GS', 37.98, 23.72)
          sat = SatelliteOrbit('Test-Sat', 99999, 53.0, 550.0, 95.0)
          passes = gs.predict_passes(sat, duration_hours=6.0)
          print(f'Calculated {len(passes)} passes successfully')
          "
          echo "✅ Python telemetry & space DTN test suite passed."

  # ── Job 5: OpenSCAD syntax check (with virtual display) ──────────
  scad-lint:
    name: OpenSCAD Syntax Check & STL Export
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and virtual framebuffer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad xvfb

      - name: Check rack_enclosure.scad syntax and export STL
        run: |
          mkdir -p docs/cad
          xvfb-run --auto-servernum openscad \
            --hardwarnings \
            --export-format binstl \
            -o docs/cad/rack_enclosure.stl \
            cad/rack_enclosure.scad
          echo "✅ OpenSCAD export succeeded: $(du -sh docs/cad/rack_enclosure.stl)"

  # ── Job 6: Deploy 3D CAD Viewer to GitHub Pages ──────────────────
  deploy-pages:
    name: Deploy 3D Viewer to GitHub Pages
    needs: [shellcheck, compose-validate, env-check, python-lint, scad-lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true