# ====================================================================
# Sovereign Mini Datacenter — Multi-Stage Quality Gates & CI Pipeline
# ====================================================================
name: Quality Gates & CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ── Quality Gate 1: Code Style, Formatting & Static Typing ────────
  quality-gate-code-analysis:
    name: "Quality Gate: Lint, Format & Type Checks"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML

      - name: Ruff Format Check
        run: ruff format --check src/ tests/

      - name: Ruff Linter Check
        run: ruff check src/ tests/

      - name: Mypy Static Type Checking
        run: mypy --ignore-missing-imports src/sovereign_dc

  # ── Quality Gate 2: Shell Script Static Analysis ───────────────────
  quality-gate-shellcheck:
    name: "Quality Gate: ShellCheck Analysis"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Lint all shell scripts
        run: |
          find software/ -name "*.sh" -type f -exec shellcheck -S error {} +

  # ── Quality Gate 3: Docker Compose Multi-Stack Validation ──────────
  quality-gate-compose-validation:
    name: "Quality Gate: Compose Stacks & Env Integrity"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check env.example completeness
        run: |
          [ -s software/env.example ] || (echo "env.example is empty!" && exit 1)
          for key in ACME_EMAIL DOMAIN_TRAEFIK DOMAIN_VPN WEBUI_SECRET_KEY OPENPROJECT_SECRET \
                     NEXTCLOUD_ADMIN_PASSWORD VAULTWARDEN_ADMIN_TOKEN \
                     GRAFANA_ADMIN_PASSWORD SMTP_HOST OLLAMA_DEFAULT_MODEL RESTIC_REPOSITORY SPACE_EXPORTER_PORT; do
            grep -q "^${key}=" software/env.example \
              || (echo "Missing key in env.example: ${key}" && exit 1)
          done
          echo "✅ env.example contains all required keys."

      - name: Validate all Docker Compose stacks
        working-directory: software
        run: |
          cp env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f vpn/docker-compose.vpn.yml config --quiet
          docker compose -f backup/docker-compose.backup.yml config --quiet
          docker compose -f telemetry/docker-compose.telemetry.yml config --quiet
          docker compose -f space/docker-compose.space.yml config --quiet
          docker compose -f agents/docker-compose.agents.yml config --quiet
          docker compose -f security/docker-compose.crowdsec.yml config --quiet
          docker compose -f mesh/lora/docker-compose.lora.yml config --quiet
          echo "✅ All Docker Compose stacks validated successfully."

  # ── Quality Gate 4: Automated Test Matrix & Strict Coverage Gate ───
  quality-gate-pytest-matrix:
    name: "Quality Gate: Pytest & Coverage (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Test Suite with Strict Coverage Enforcement (>=85%)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall software/ src/
          pytest tests/ --cov=sovereign_dc --cov-fail-under=85
          echo "✅ Pytest passed with >=85% code coverage."

  # ── Quality Gate 5: Security & Dependency Vulnerability Scan ───────
  quality-gate-security-audit:
    name: "Quality Gate: Security & Dependency Audit"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python Dependencies
        run: |
          pip-audit --desc on || echo "⚠️ pip-audit non-blocking notice for dev dependencies"

  # ── Quality Gate 6: OpenSCAD 3D CAD Geometry Export ────────────────
  quality-gate-scad-export:
    name: "Quality Gate: 3D CAD Geometry & STL Verification"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and virtual framebuffer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad xvfb

      - name: Check rack_enclosure.scad syntax and export STL
        run: |
          mkdir -p docs/cad
          xvfb-run --auto-servernum openscad \
            --hardwarnings \
            --export-format binstl \
            -o docs/cad/rack_enclosure.stl \
            cad/rack_enclosure.scad
          echo "✅ OpenSCAD export succeeded: $(du -sh docs/cad/rack_enclosure.stl)"

  # ── Quality Gate 7: Embedded Firmware & ESPHome Integrity ──────────
  quality-gate-firmware-validation:
    name: "Quality Gate: Embedded Firmware & ESPHome"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for ESPHome validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate ESPHome and Firmware configurations
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python -c "import yaml; yaml.SafeLoader.add_constructor('!secret', lambda l, n: ''); yaml.SafeLoader.add_constructor('!include', lambda l, n: ''); yaml.safe_load(open('firmware/esphome_smdc_bridge.yaml'))"
          [ -s firmware/esp32_telemetry_bridge.ino ] || (echo "Arduino firmware missing!" && exit 1)
          echo "✅ ESPHome configuration and Arduino INO verified."

  # ── Quality Gate Final: GitHub Pages Deployment ────────────────────
  deploy-pages:
    name: "Deploy 3D Digital Twin to GitHub Pages"
    needs:
      - quality-gate-code-analysis
      - quality-gate-shellcheck
      - quality-gate-compose-validation
      - quality-gate-pytest-matrix
      - quality-gate-security-audit
      - quality-gate-scad-export
      - quality-gate-firmware-validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true