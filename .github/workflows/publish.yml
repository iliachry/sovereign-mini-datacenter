# ====================================================================
# Sovereign Mini Datacenter — Container Release Pipeline
# The Python package is published to PyPI by release.yml (tag push) only.
# ====================================================================
name: Publish Container Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ── Build & Push Multi-Arch Container Image to GHCR ─────────────────
  publish-container:
    name: Build & Publish GHCR Container Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sovereign-power-exporter
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./software/telemetry
          file: ./software/telemetry/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}