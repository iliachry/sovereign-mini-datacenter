{{- /*
Application secrets for the core services. Values left empty in values.yaml are
generated randomly on first install and then re-used on every upgrade via
`lookup`, so credentials never silently rotate.
*/ -}}
{{- if or .Values.core.openWebUI.enabled .Values.core.vaultwarden.enabled .Values.core.nextcloud.enabled }}
{{- $secretName := printf "%s-core-secrets" (include "sovereign-stack.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $existingData := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "sovereign-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.core.openWebUI.enabled }}
  webui-secret-key: {{ include "sovereign-stack.secretValue" (dict "explicit" .Values.core.openWebUI.secretKey "existing" (index $existingData "webui-secret-key") "length" 48) | quote }}
  {{- end }}
  {{- if .Values.core.vaultwarden.enabled }}
  vaultwarden-admin-token: {{ include "sovereign-stack.secretValue" (dict "explicit" .Values.core.vaultwarden.adminToken "existing" (index $existingData "vaultwarden-admin-token") "length" 48) | quote }}
  {{- end }}
  {{- if .Values.core.nextcloud.enabled }}
  nextcloud-admin-user: {{ .Values.core.nextcloud.adminUser | b64enc | quote }}
  nextcloud-admin-password: {{ include "sovereign-stack.secretValue" (dict "explicit" .Values.core.nextcloud.adminPassword "existing" (index $existingData "nextcloud-admin-password") "length" 32) | quote }}
  {{- end }}
{{- end }}
