{{- if .Values.ai.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign-stack.fullname" . }}-ollama
  labels:
    {{- include "sovereign-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-cluster
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: http-ollama
      protocol: TCP
      name: http-ollama
  selector:
    {{- include "sovereign-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-cluster
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign-stack.fullname" . }}-qdrant
  labels:
    {{- include "sovereign-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-cluster
spec:
  type: ClusterIP
  ports:
    - port: 6333
      targetPort: http-qdrant
      protocol: TCP
      name: http-qdrant
  selector:
    {{- include "sovereign-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-cluster
{{- end }}
{{- if .Values.telemetry.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign-stack.fullname" . }}-power-exporter
  labels:
    {{- include "sovereign-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.telemetry.powerExporter.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "sovereign-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
{{- end }}
