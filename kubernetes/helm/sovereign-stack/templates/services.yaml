apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign-stack.fullname" . }}-ollama
  labels:
    {{- include "sovereign-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: http-ollama
  selector:
    {{- include "sovereign-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-cluster
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign-stack.fullname" . }}-qdrant
  labels:
    {{- include "sovereign-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 6333
      targetPort: 6333
      protocol: TCP
      name: http-qdrant
  selector:
    {{- include "sovereign-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-cluster
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign-stack.fullname" . }}-power-exporter
  labels:
    {{- include "sovereign-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9101
      targetPort: 9101
      protocol: TCP
      name: metrics
  selector:
    {{- include "sovereign-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
