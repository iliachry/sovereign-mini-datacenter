# Default values for sovereign-stack.
# This is a YAML-formatted file.

global:
  domain: sovereign.local
  storageClass: local-path

# Local AI Cluster (Ollama + Qdrant)
ai:
  enabled: true
  ollama:
    image:
      repository: ollama/ollama
      tag: latest
      pullPolicy: IfNotPresent
    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: 16Gi
        cpu: "8"
      requests:
        memory: 8Gi
        cpu: "4"
    persistence:
      enabled: true
      size: 100Gi
    defaultModel: "qwen2.5-coder:7b"
  
  qdrant:
    image:
      repository: qdrant/qdrant
      tag: v1.11.0
      pullPolicy: IfNotPresent
    persistence:
      enabled: true
      size: 20Gi

# Core Sovereign Services
core:
  openWebUI:
    enabled: true
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: main
    service:
      port: 8080
    # Leave empty to auto-generate a random key on first install (persisted via lookup).
    secretKey: ""

  vaultwarden:
    enabled: true
    image:
      repository: vaultwarden/server
      tag: latest
    service:
      port: 80
    persistence:
      enabled: true
      size: 5Gi
    signupsAllowed: false
    # Leave empty to auto-generate a random admin token on first install.
    adminToken: ""

  nextcloud:
    enabled: true
    image:
      repository: nextcloud
      tag: 29-apache
    service:
      port: 80
    persistence:
      enabled: true
      size: 200Gi
    adminUser: admin
    # Leave empty to auto-generate a random admin password on first install.
    adminPassword: ""

# Micro-Grid & Telemetry
telemetry:
  enabled: true
  powerExporter:
    image:
      repository: ghcr.io/iliachry/sovereign-power-exporter
      tag: latest
    port: 9101
    simulate: true

# Space Communications & LoRa
space:
  enabled: true
  dtnNode:
    image:
      repository: ghcr.io/iliachry/sovereign-space-node
      tag: latest
      pullPolicy: IfNotPresent
    port: 9102
    localEid: "dtn://smdc-node-01.space"
    groundStation:
      name: "Sovereign-Ground-01"
      latitude: "37.9838"
      longitude: "23.7275"
    persistence:
      enabled: true
      size: 10Gi
  loraGateway:
    enabled: true
    serialPort: "/dev/ttyUSB0"

# Ingress Configuration (Traefik)
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  # Hostnames are prefixed onto global.domain (e.g. ai.sovereign.local)
  hosts:
    openWebUI: ai
    vaultwarden: vault
    nextcloud: cloud
  tls:
    enabled: true
    secretName: sovereign-tls-cert
