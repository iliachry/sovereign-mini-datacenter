# Default values for sovereign-stack.
# This is a YAML-formatted file.

# ── Cluster prerequisites (NOT installed by this chart) ─────────────────────
#   * a StorageClass with a dynamic provisioner  -> global.storageClass
#   * an ingress controller                      -> ingress.className
#   * the NVIDIA device plugin (nvidia.com/gpu)  -> ai.ollama.gpu.enabled
# k3s ships `local-path` and Traefik out of the box. Talos and vanilla
# Kubernetes ship none of them: install them first or disable the feature.

global:
  domain: sovereign.local
  # StorageClass for every PVC. "" omits storageClassName so the cluster's
  # default StorageClass is used.
  storageClass: local-path

# Local AI Cluster (Ollama + Qdrant)
ai:
  enabled: true
  ollama:
    image:
      repository: ollama/ollama
      tag: latest
      pullPolicy: IfNotPresent
    # GPU request. Requires the NVIDIA device plugin to advertise
    # nvidia.com/gpu on a node; without it the pod stays Pending. Set
    # enabled: false for CPU-only inference. Do not also put nvidia.com/gpu
    # into resources.limits below.
    gpu:
      enabled: true
      count: 1
    # RuntimeClass for the AI pod. Leave empty when the NVIDIA runtime is the
    # container runtime default. Set to "nvidia" where the RuntimeClass exists
    # (k3s creates it when it detects the NVIDIA container toolkit; on Talos
    # you create it yourself per the Talos NVIDIA guide).
    runtimeClassName: ""
    resources:
      limits:
        memory: 16Gi
        cpu: "8"
      requests:
        memory: 8Gi
        cpu: "4"
    persistence:
      # false -> emptyDir (models are re-downloaded after every pod restart)
      enabled: true
      size: 100Gi
    # Pulled in the background after the container starts (best effort; needs
    # outbound access to the model registry). "" disables the pre-pull.
    defaultModel: "qwen2.5-coder:7b"

  qdrant:
    image:
      repository: qdrant/qdrant
      tag: v1.11.0
      pullPolicy: IfNotPresent
    persistence:
      # false -> emptyDir (vector collections are lost on pod restart)
      enabled: true
      size: 20Gi

# Core Sovereign Services
core:
  openWebUI:
    enabled: true
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: main
    service:
      port: 8080
    # Leave empty to auto-generate a random key on first install (persisted via lookup).
    secretKey: ""

  vaultwarden:
    enabled: true
    image:
      repository: vaultwarden/server
      tag: latest
    service:
      port: 80
    persistence:
      enabled: true
      size: 5Gi
    signupsAllowed: false
    # Leave empty to auto-generate a random admin token on first install.
    adminToken: ""

  nextcloud:
    enabled: true
    image:
      repository: nextcloud
      tag: 29-apache
    service:
      port: 80
    persistence:
      enabled: true
      size: 200Gi
    adminUser: admin
    # Leave empty to auto-generate a random admin password on first install.
    adminPassword: ""

# Micro-Grid & Telemetry
telemetry:
  enabled: true
  powerExporter:
    # Default (image.repository empty): the exporter script shipped inside this
    # chart (files/power_exporter.py, the same file the Compose overlay
    # bind-mounts) is mounted from a ConfigMap into the stock Python image
    # below and run with `python /app/power_exporter.py`. It needs only the
    # Python standard library, so nothing has to be built or published first.
    runtimeImage:
      repository: python
      tag: 3.11-alpine
      pullPolicy: IfNotPresent
    # Prebuilt image instead (built from software/telemetry/Dockerfile). Set
    # repository to use it; the ConfigMap is then not created. This repository's
    # CI publishes ghcr.io/<owner>/sovereign-power-exporter only when a GitHub
    # release is published, and a GHCR package is private until its owner makes
    # it public: an image that cannot be pulled leaves the pod in
    # ImagePullBackOff and `helm install --wait` never completes.
    image:
      repository: ""
      tag: latest
      pullPolicy: IfNotPresent
    port: 9101
    # true  -> synthetic, physics-shaped demo data.
    # false -> hardware mode: the exporter re-exports the readings of the ESP32
    #          telemetry bridge at bridgeUrl (firmware/). With bridgeUrl empty it
    #          reports sovereign_telemetry_source_up 0 and no measurements.
    simulate: true
    # /metrics URL of the ESP32 telemetry bridge, e.g. http://192.168.1.50/metrics
    bridgeUrl: ""
    # Battery SoC thresholds (%) of shedding levels 1 to 4, passed to the
    # exporter as SHEDDING_L1_SOC..SHEDDING_L4_SOC. sovereign_load_shedding_active
    # is 1 while SoC is below l3Soc. They must be numbers within 0-100 with
    # l1Soc > l2Soc > l3Soc > l4Soc; otherwise the exporter uses all four
    # defaults. Give every other component of the node the same values.
    shedding:
      l1Soc: 50
      l2Soc: 30
      l3Soc: 20
      l4Soc: 10

# Space Communications (DTN node)
space:
  # Disabled by default: no CI workflow builds or publishes the
  # sovereign-space-node image referenced below, so enabling this without
  # first building and pushing that image yourself ends in ImagePullBackOff.
  enabled: false
  dtnNode:
    image:
      repository: ghcr.io/iliachry/sovereign-space-node
      tag: latest
      pullPolicy: IfNotPresent
    port: 9102
    # This node's id (NODE_ID), the same one the rest of the stack uses.
    nodeId: "smdc-dgx-01"
    # DTN endpoint id (DTN_LOCAL_EID). Empty: derived from nodeId as
    # dtn://<nodeId>.sovereign.space, so the node has one identity.
    localEid: ""
    groundStation:
      name: "Sovereign-Ground-01"
      latitude: "37.9838"
      longitude: "23.7275"
    persistence:
      enabled: true
      size: 10Gi

# Ingress Configuration (defaults target the Traefik bundled with k3s)
ingress:
  enabled: true
  # "" omits ingressClassName (the cluster's default IngressClass is used).
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # No certificate issuer is requested by default: a public ACME CA such as
    # Let's Encrypt cannot issue for the default *.sovereign.local names. With
    # a publicly resolvable domain (or an internal CA ClusterIssuer) add e.g.:
    # cert-manager.io/cluster-issuer: <your-cluster-issuer>
  # Hostnames are prefixed onto global.domain (e.g. ai.sovereign.local)
  hosts:
    openWebUI: ai
    vaultwarden: vault
    nextcloud: cloud
  tls:
    enabled: true
    # Must exist (created by cert-manager via the annotation above, or by you).
    # If it is missing the ingress controller serves its default certificate.
    secretName: sovereign-tls-cert
