[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-dc"
version = "1.2.0"
description = "Sovereign Mini Datacenter — Self-Powered Micro-Grid, AI Cluster, Delay-Tolerant Space Comms & Autonomous Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ilias Chrysostomidis", email = "ilias@metatopia.gr" },
]
keywords = [
    "datacenter",
    "sovereign-cloud",
    "off-grid",
    "solar-power",
    "ai-cluster",
    "self-hosted",
    "delay-tolerant-networking",
    "space-communications",
    "satellite-tracking",
    "bundle-protocol-v7",
    "autonomous-agents",
    "crowdsec",
    "esp32-bridge",
    "victron-energy",
    "lifepo4-bms",
    "digital-twin"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
smdc = "sovereign_dc.cli:main"

[project.urls]
Homepage = "https://github.com/iliachry/sovereign-mini-datacenter"
Documentation = "https://iliachry.gr/sovereign-mini-datacenter/"
Repository = "https://github.com/iliachry/sovereign-mini-datacenter"