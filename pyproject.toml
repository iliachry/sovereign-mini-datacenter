[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-dc"
version = "1.4.0"
description = "Sovereign Mini Datacenter — Self-Powered Micro-Grid, AI Cluster, Delay-Tolerant Space Comms & Autonomous Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ilias Chrysovergis", email = "ilias@metatopia.gr" },
]
keywords = [
    "datacenter",
    "micro-datacenter",
    "sovereign-cloud",
    "edge-computing",
    "off-grid",
    "solar-power",
    "ai-cluster",
    "local-ai",
    "ollama",
    "qdrant",
    "self-hosted",
    "enterprise-framework",
    "mcp-server",
    "delay-tolerant-networking",
    "rfc-9171",
    "space-communications",
    "satellite-tracking",
    "bundle-protocol-v7",
    "post-quantum-cryptography",
    "zero-trust",
    "autonomous-agents",
    "crowdsec",
    "esp32-bridge",
    "victron-energy",
    "lifepo4-bms",
    "digital-twin",
    "hardware-enclosure"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "cryptography>=42.0.0",
    "dilithium-py>=1.4.0",
    "kyber-py>=1.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyyaml>=6.0",
]
lint = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyyaml>=6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
smdc = "sovereign_dc.cli:main"

[project.urls]
Homepage = "https://github.com/iliachry/sovereign-mini-datacenter"
Documentation = "https://iliachry.gr/sovereign-mini-datacenter/"
Repository = "https://github.com/iliachry/sovereign-mini-datacenter"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v --cov=sovereign_dc --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["sovereign_dc", "src/sovereign_dc"]
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
precision = 1

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501", # line length handled by formatter
    "S101", # allow assert statements in tests
    # S104 (bind to all interfaces) and S108 (hard-coded temp path) are NOT ignored globally:
    # the two Prometheus exporters and the two legacy-/tmp lookups carry a justified
    # per-line `# noqa`. S324 (md5) is not ignored either: nothing uses md5 any more.
    "S110", # allow try-except-pass (best-effort cleanup and optional-probe fallbacks)
    "S311", # allow pseudo-random generators in simulation link models
    "S310", # allow urllib.request open (URLs come from operator configuration, http/https endpoints)
    "S603", # allow subprocess run with argument lists (never shell=True)
    "S607", # allow starting docker/nvidia-smi/sensors by name (resolved through PATH)
    "B008", # allow function call in argument default
]

[tool.ruff.lint.isort]
known-first-party = ["sovereign_dc"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true