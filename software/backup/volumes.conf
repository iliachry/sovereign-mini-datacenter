# Backup coverage of every named volume of the merged stack (`setup.sh --all`).
#
# Single source of truth, read by:
#   - backup.sh                    which volumes (and which sub-paths) restic walks
#   - scripts/validate_compose.sh  fails when a named volume of the merged stack is
#                                  missing here, when a `files` volume is not mounted
#                                  read-only at /data/<key> by docker-compose.backup.yml,
#                                  or when a `dumped`/`skip` volume is mounted there
#
# Format (pipe-separated, no spaces around the pipes):
#   key|name|class|paths|reason
#
#   key    volume key in the Compose files
#   name   `-` = project-scoped (<project>_<key>); otherwise the fixed `name:` the
#          Compose file gives the volume
#   class  files   restic backs up `paths` of the volume (file-level). Live database
#                  files inside it are excluded by backup.sh and replaced by a dump.
#          dumped  NOT walked by restic at all: the whole volume is a live database
#                  directory; a native dump replaces it.
#          skip    not backed up; `reason` says why and what is lost.
#   paths  space-separated paths relative to the volume root (`.` = everything)
#
# --- Core stack (software/docker-compose.yml) -------------------------------
traefik_certs|-|files|.|ACME account key and issued certificates (acme.json)
webui_data|-|files|.|Open WebUI uploads and settings; webui.db is excluded and dumped (SQLite)
gitlab_config|-|files|.|gitlab.rb, gitlab-secrets.json, SSH host keys: NOT part of gitlab-backup
gitlab_data|-|files|backups|only the gitlab-backup archives; everything else (PostgreSQL, Redis, Gitaly) is live and is inside the archive
openproject_data|-|files|.|attachments (assets)
openproject_pgdata|-|dumped||live PostgreSQL data directory of the all-in-one image; replaced by pg_dump
nextcloud_data|-|files|.|Nextcloud code, config and user files; data/*.db is excluded and dumped (SQLite)
vaultwarden_data|-|files|.|attachments, sends, rsa_key*, config.json; db.sqlite3 is excluded and dumped (SQLite)
grafana_data|-|files|.|plugins and local files; grafana.db is excluded and dumped (SQLite)
prometheus_data|-|files|.|BEST EFFORT: completed TSDB blocks only; WAL and head chunks are excluded (no admin API, no snapshot)
# not backed up: the vector index is live RocksDB/segment data with no dump taken here.
# It is re-creatable: the knowledge indexer re-embeds Nextcloud files, Open WebUI
# re-indexes its uploads (kept in webui_data). Lost on host loss: nothing but compute time.
qdrant_data|-|skip||re-creatable vector index (re-embed from Nextcloud files and Open WebUI uploads)
# not backed up: model weights, tens of GB, pulled again with `ollama pull`.
# An off-grid node needs a network path (or a model archive) to do that.
ollama_data|-|skip||re-downloadable model weights (`ollama pull`)
# not backed up: logs.
gitlab_logs|-|skip||GitLab service logs
traefik_logs|sovereign_traefik_logs|skip||Traefik access log (read by CrowdSec); rotate with security/traefik-access-log.logrotate; not state
#
# --- Overlays ----------------------------------------------------------------
headscale_data|-|files|.|noise/DERP private keys; db.sqlite is excluded and dumped (SQLite)
space_spool_data|sovereign_space_spool|files|.|DTN spool directory; bundles.db is excluded and dumped (SQLite, WAL)
sovereign_mode|-|files|.|power-mode flag written by sentinel-copilot (rewritten on its next poll after a restore)
crowdsec_data|sovereign_crowdsec_data|files|.|GeoIP and hub data; crowdsec.db is excluded and dumped (SQLite)
crowdsec_config|sovereign_crowdsec_config|files|.|CrowdSec configuration and local/online API credentials
# not backed up: this volume IS the local restic repository.
backup_storage|-|skip||the restic repository itself
