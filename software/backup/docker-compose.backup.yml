# Restic encrypted backup daemon overlay.
#
# Relative paths below are resolved against the Compose project directory,
# which is `software/` when this file is merged with the core stack
# (`./setup.sh --with-backup`). To run it standalone against a core stack that is
# already up, add the attach file, which declares the core stack's network and
# volumes as external (use the same -p <name> as the core stack if it is not the
# default "software"):
#   docker compose --project-directory software \
#     -f software/docker-compose.attach.yml -f software/backup/docker-compose.backup.yml up -d
#
# No `name:` is set on sovereign_net or on any volume key that docker-compose.yml
# also declares: merged or attached, they resolve to the core stack's own
# <project>_* objects for every project name (scripts/validate_compose.sh checks it).
#
# WHAT THIS CONTAINER DOES (and does not do)
# It runs the restic phase of backup.sh only: the database dumps and the Nextcloud
# volume copy (taken in Nextcloud's maintenance window) that the host wrote to
# BACKUP_DUMP_DIR, the deployment configuration (this software/ directory, .env
# included) and the static files of the volumes listed as `files` in
# backup/volumes.conf. It never copies a live database directory:
#   - openproject_pgdata (live PostgreSQL) and qdrant_data are not mounted at all;
#   - SQLite files, GitLab's live data and the Prometheus WAL are excluded.
# It cannot produce the dumps itself: that needs `docker exec`, i.e. the Docker
# socket, which is root on the host; a network-attached backup container does not
# get it. The dumps come from the host:
#   sudo sh software/backup/backup.sh --dump-only      # cron / systemd timer
# If the dump MANIFEST is missing, incomplete, older than
# BACKUP_DUMP_MAX_AGE_SECONDS, or names a dump file that is missing or does not have
# the recorded size and SHA-256, backup.sh exits non-zero, nothing is uploaded and
# the container turns unhealthy. See backup/README.md.
networks:
  sovereign_net:

services:
  backup-cron:
    image: restic/restic:0.19.1
    container_name: sovereign_backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Starting Sovereign Restic Backup Daemon (interval: $${BACKUP_INTERVAL_SECONDS}s)..."
        while true; do
          if sh /config/backup/backup.sh; then
            date +%s > /tmp/backup.ok
          else
            echo "[ERROR] Backup run failed: NO snapshot was taken; retrying after $${BACKUP_INTERVAL_SECONDS}s"
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    environment:
      - BACKUP_MODE=container
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_DUMP_MAX_AGE_SECONDS=${BACKUP_DUMP_MAX_AGE_SECONDS:-93600}
      # Local repositories must live under /var/backups/sovereign (the
      # backup_storage volume) to survive container re-creation.
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-/var/backups/sovereign}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in software/.env}
      - AWS_ACCESS_KEY_ID=${RESTIC_S3_KEY:-}
      - AWS_SECRET_ACCESS_KEY=${RESTIC_S3_SECRET:-}
      - RESTIC_COMPRESSION=auto
    healthcheck:
      # Healthy only while the last successful run is recent. A daemon whose runs
      # keep failing (stale dumps, unreachable repository) shows as unhealthy.
      test:
        - CMD-SHELL
        - '[ -f /tmp/backup.ok ] && [ $$(( $$(date +%s) - $$(cat /tmp/backup.ok) )) -lt $$(( BACKUP_INTERVAL_SECONDS * 2 + 3600 )) ]'
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 6h
    volumes:
      # Deployment configuration, backed up as /config: compose files and overlays,
      # prometheus.yml, grafana provisioning, headscale config, acquis.d and .env.
      # .env holds the stack's secrets; it is needed to rebuild the node and goes
      # into the encrypted repository only.
      - .:/config:ro
      # Database dumps (smdc-dumps) and the Nextcloud volume copy (smdc-nextcloud-files)
      # written on the host by `backup.sh --dump-only`.
      - ${BACKUP_DUMP_DIR:-/var/backups/sovereign-dumps}:/dumps:ro
      - backup_storage:/var/backups/sovereign
      # One read-only mount per `files` row of backup/volumes.conf, at /data/<key>
      # (scripts/validate_compose.sh fails when the two lists differ).
      - traefik_certs:/data/traefik_certs:ro
      - webui_data:/data/webui_data:ro
      - gitlab_data:/data/gitlab_data:ro
      - gitlab_config:/data/gitlab_config:ro
      - openproject_data:/data/openproject_data:ro
      # Walked only when the dumps were made with BACKUP_NEXTCLOUD_MODE=online; in the
      # default maintenance mode the copy under /dumps is backed up instead.
      - nextcloud_data:/data/nextcloud_data:ro
      - vaultwarden_data:/data/vaultwarden_data:ro
      - grafana_data:/data/grafana_data:ro
      - prometheus_data:/data/prometheus_data:ro
      - headscale_data:/data/headscale_data:ro
      - space_spool_data:/data/space_spool_data:ro
      - sovereign_mode:/data/sovereign_mode:ro
      - crowdsec_data:/data/crowdsec_data:ro
      - crowdsec_config:/data/crowdsec_config:ro
    networks:
      - sovereign_net

# Volume keys that docker-compose.yml also declares carry no `name:`, so that, when
# merged, Compose resolves them to the very same <project>_* volumes the services
# use. Standalone, docker-compose.attach.yml binds them to the existing volumes of
# the core stack as external volumes (see the header).
# Overlay volumes repeat exactly what their own overlay declares (no name, or the
# same fixed `name:`), so they resolve to the same volume merged or standalone. If
# that overlay is not deployed, an empty volume is created and backed up.
volumes:
  backup_storage:
  traefik_certs:
  webui_data:
  gitlab_data:
  gitlab_config:
  openproject_data:
  nextcloud_data:
  vaultwarden_data:
  grafana_data:
  prometheus_data:
  # vpn/docker-compose.vpn.yml
  headscale_data:
  # space/docker-compose.space.yml
  space_spool_data:
    name: sovereign_space_spool
  # agents/docker-compose.agents.yml
  sovereign_mode:
  # security/docker-compose.crowdsec.yml
  crowdsec_data:
    name: sovereign_crowdsec_data
  crowdsec_config:
    name: sovereign_crowdsec_config
