# Autonomous Local AI Agents overlay.
#
# Relative paths below are resolved against the Compose project directory,
# which is `software/` when this file is merged with the core stack
# (`./setup.sh --with-agents`). To run it standalone against a core stack that is
# already up, add the attach file, which declares the core stack's network and
# volumes as external (use the same -p <name> as the core stack if it is not the
# default "software"):
#   docker compose --project-directory software \
#     -f software/docker-compose.attach.yml -f software/agents/docker-compose.agents.yml up -d
#
# No `name:` is set on sovereign_net or on any volume key that docker-compose.yml
# also declares: merged or attached, they resolve to the core stack's own
# <project>_* objects for every project name (scripts/validate_compose.sh checks it).
services:
  knowledge-indexer:
    image: python:3.11-alpine
    container_name: sovereign_knowledge_indexer
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./agents:/app:ro
      # nextcloud_data is Nextcloud's whole /var/www/html (its PHP source tree,
      # apps and config as well as the data directory), so it is mounted outside
      # the document root and DOCS_WATCH_DIR points at the data directory only.
      # User files live in data/<user>/files. (A volume `subpath: data` mount
      # would be tighter but fails container creation until Nextcloud has
      # created that directory on first start.)
      # NEXTCLOUD_DATA_PATH may replace the volume with a host directory that
      # has the same layout (a Nextcloud root containing data/).
      - ${NEXTCLOUD_DATA_PATH:-nextcloud_data}:/data/nextcloud:ro
      - sovereign_mode:/run/sovereign:ro
    environment:
      - SOVEREIGN_MODE_FILE=/run/sovereign/mode
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_BASE_URL=http://qdrant:6333
      - EMBEDDING_MODEL=nomic-embed-text
      - DOCS_WATCH_DIR=${DOCS_WATCH_DIR:-/data/nextcloud/data}
      # Only users' own files (data/<user>/files/**) are indexed. Nextcloud's
      # appdata_*, trash bin, file versions, caches, partial uploads and hidden
      # directories are pruned by the indexer's DOCS_EXCLUDE_DIRS default as
      # well. If DOCS_WATCH_DIR points at a plain document tree instead, set
      # DOCS_INCLUDE_GLOB= (empty) in .env to index everything under it.
      - DOCS_INCLUDE_GLOB=${DOCS_INCLUDE_GLOB-*/files/**}
      - DOCS_MAX_FILE_BYTES=${DOCS_MAX_FILE_BYTES:-5242880}
      # Passed through only when set in .env (no value here): unset keeps the
      # indexer's built-in exclude list.
      - DOCS_EXCLUDE_DIRS
    networks:
      - sovereign_net
    command: ["python3", "knowledge_indexer.py"]

  gitlab-reviewer:
    image: python:3.11-alpine
    container_name: sovereign_gitlab_reviewer
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./agents:/app:ro
    environment:
      - GITLAB_API_URL=http://gitlab/api/v4
      - GITLAB_API_TOKEN=${GITLAB_REVIEWER_TOKEN:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CODE_MODEL=qwen2.5-coder:7b
    networks:
      - sovereign_net
    command: ["python3", "gitlab_reviewer.py"]

  sentinel-copilot:
    image: python:3.11-alpine
    container_name: sovereign_sentinel_copilot
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./agents:/app:ro
      # Shared with knowledge-indexer so the sentinel's power mode actually reaches it.
      - sovereign_mode:/run/sovereign
    environment:
      - SOVEREIGN_MODE_FILE=/run/sovereign/mode
      - PROMETHEUS_URL=http://prometheus:9090
      - POWER_EXPORTER_URL=http://power-exporter:9101/metrics
      # Seconds between polls of the power exporter (a change in battery state is
      # noticed up to this long after it happens). Minimum 1.
      - SENTINEL_POLL_INTERVAL_SECONDS=${SENTINEL_POLL_INTERVAL_SECONDS:-30}
    networks:
      - sovereign_net
    command: ["python3", "sentinel_copilot.py"]

networks:
  sovereign_net:

volumes:
  nextcloud_data:
  sovereign_mode:
