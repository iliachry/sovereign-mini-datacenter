# CrowdSec security engine overlay — DETECTION ONLY.
#
# CrowdSec parses the Traefik access log and host logs and records decisions,
# but no bouncer (remediation component) is configured, so nothing is blocked.
# Inspect with: docker exec sovereign_crowdsec cscli alerts list
# To block, add a bouncer (e.g. a Traefik bouncer plugin or the host firewall
# bouncer) and register it with: docker exec sovereign_crowdsec cscli bouncers add <name>
#
# Relative paths below are resolved against the Compose project directory,
# which is `software/` when this file is merged with the core stack
# (`./setup.sh --with-security`). To run it standalone against a core stack that is
# already up, add the attach file, which declares the core stack's network and
# volumes as external (use the same -p <name> as the core stack if it is not the
# default "software"):
#   docker compose --project-directory software \
#     -f software/docker-compose.attach.yml -f software/security/docker-compose.crowdsec.yml up -d
#
# No `name:` is set on sovereign_net or on any volume key that docker-compose.yml
# also declares: merged or attached, they resolve to the core stack's own
# <project>_* objects for every project name (scripts/validate_compose.sh checks it).
services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.0
    container_name: sovereign_crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/linux crowdsecurity/http-cve
    volumes:
      - /var/log:/var/log:ro
      # Written by Traefik in the core stack (--accesslog.filepath). Mounted outside
      # /var/log: a volume cannot be nested under that read-only bind mount.
      - traefik_logs:/traefik-logs:ro
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - ./security/acquis.d/traefik.yaml:/etc/crowdsec/acquis.d/traefik.yaml:ro
    networks:
      - sovereign_net

volumes:
  traefik_logs:
    name: sovereign_traefik_logs
  crowdsec_data:
    name: sovereign_crowdsec_data
  crowdsec_config:
    name: sovereign_crowdsec_config

networks:
  sovereign_net:
