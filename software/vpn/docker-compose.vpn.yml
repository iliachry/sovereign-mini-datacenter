# Headscale mesh VPN control plane overlay.
#
# Relative paths below are resolved against the Compose project directory,
# which is `software/` when this file is merged with the core stack
# (`./setup.sh --with-vpn`). To run it standalone, pin the project directory:
#   docker compose --project-directory software -f software/vpn/docker-compose.vpn.yml up -d
#
# Before starting, set server_url in vpn/config/headscale.yaml.
networks:
  sovereign_net:
    name: software_sovereign_net

services:
  headscale:
    # Pinned: vpn/config/headscale.yaml follows the 0.23.x config schema.
    image: headscale/headscale:0.23.0
    container_name: sovereign_headscale
    restart: unless-stopped
    # The image entrypoint is the headscale binary.
    command: serve
    volumes:
      - ./vpn/config/headscale.yaml:/etc/headscale/config.yaml:ro
      - headscale_data:/var/lib/headscale
    networks:
      - sovereign_net
    ports:
      - "3478:3478/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.headscale.rule=Host(`${DOMAIN_VPN:-vpn.sovereign.local}`)"
      - "traefik.http.routers.headscale.entrypoints=websecure"
      - "traefik.http.routers.headscale.tls.certresolver=le"
      - "traefik.http.services.headscale.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "headscale", "version"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  headscale_data:
