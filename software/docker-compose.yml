version: '3.8'

services:

  # ─── 1. OLLAMA (GPU-Accelerated Local LLM API) ───
  ollama:
    image: ollama/ollama:latest
    container_name: sovereign_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=4
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── 2. OPEN-WEBUI (ChatGPT-Style Private Interface) ───
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: sovereign_webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-sovereign_secret_key_change_me}
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - ollama

  # ─── 3. GITLAB CE (Self-Hosted Git & CI/CD) ───
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: sovereign_gitlab
    restart: unless-stopped
    hostname: ${DOMAIN_GITLAB:-gitlab.local}
    ports:
      - "8080:80"
      - "8443:443"
      - "2222:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${DOMAIN_GITLAB:-gitlab.local}:8080'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

  # ─── 4. OPENPROJECT (Project & Task Management) ───
  openproject:
    image: openproject/community:13
    container_name: sovereign_openproject
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - OPENPROJECT_SECRET_KEY_BASE=${OPENPROJECT_SECRET:-openproject_secret_change_me}
      - OPENPROJECT_HOST__NAME=${DOMAIN_PROJECTS:-projects.local}:8081
      - OPENPROJECT_HTTPS=false
    volumes:
      - openproject_data:/var/openproject/assets

  # ─── 5. NEXTCLOUD (End-to-End Encrypted File Cloud) ───
  nextcloud:
    image: nextcloud:stable-apache
    container_name: sovereign_nextcloud
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-admin_password_change_me}
    volumes:
      - nextcloud_data:/var/www/html

volumes:
  ollama_data:
  webui_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  openproject_data:
  nextcloud_data:
