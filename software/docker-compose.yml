networks:
  sovereign_net:
    driver: bridge

services:

  # ─── 0. TRAEFIK (Reverse Proxy + Automatic TLS via Let's Encrypt) ───
  traefik:
    image: traefik:v3.1
    container_name: sovereign_traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@sovereign.local}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - sovereign_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${DOMAIN_TRAEFIK:-traefik.sovereign.local}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=le"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-admin:$$apr1$$xyz$$changeme}"

  # ─── 1. OLLAMA (GPU-Accelerated Local LLM API) ───
  ollama:
    image: ollama/ollama:latest
    container_name: sovereign_ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=4
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sovereign_net
    deploy:
      resources:
        limits:
          memory: 48G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 2. OPEN-WEBUI (ChatGPT-Style Private Interface) ───
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: sovereign_webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - webui_data:/app/backend/data
    networks:
      - sovereign_net
    depends_on:
      ollama:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webui.rule=Host(`${DOMAIN_WEBUI:-ai.sovereign.local}`)"
      - "traefik.http.routers.webui.entrypoints=websecure"
      - "traefik.http.routers.webui.tls.certresolver=le"
      - "traefik.http.services.webui.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 3. GITLAB CE (Self-Hosted Git & CI/CD) ───
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: sovereign_gitlab
    restart: unless-stopped
    hostname: ${DOMAIN_GITLAB:-gitlab.sovereign.local}
    ports:
      - "2222:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${DOMAIN_GITLAB:-gitlab.sovereign.local}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "${SMTP_HOST:-smtp.sovereign.local}"
        gitlab_rails['smtp_port'] = ${SMTP_PORT:-587}
        gitlab_rails['smtp_user_name'] = "${SMTP_USER}"
        gitlab_rails['smtp_password'] = "${SMTP_PASSWORD}"
        gitlab_rails['smtp_tls'] = false
        gitlab_rails['smtp_starttls_auto'] = true
        gitlab_rails['gitlab_email_from'] = "${SMTP_FROM:-gitlab@sovereign.local}"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - sovereign_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitlab.rule=Host(`${DOMAIN_GITLAB:-gitlab.sovereign.local}`)"
      - "traefik.http.routers.gitlab.entrypoints=websecure"
      - "traefik.http.routers.gitlab.tls.certresolver=le"
      - "traefik.http.services.gitlab.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  # ─── 4. OPENPROJECT (Project & Task Management) ───
  openproject:
    image: openproject/community:13
    container_name: sovereign_openproject
    restart: unless-stopped
    environment:
      - OPENPROJECT_SECRET_KEY_BASE=${OPENPROJECT_SECRET}
      - OPENPROJECT_HOST__NAME=${DOMAIN_PROJECTS:-projects.sovereign.local}
      - OPENPROJECT_HTTPS=true
    volumes:
      - openproject_data:/var/openproject/assets
    networks:
      - sovereign_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openproject.rule=Host(`${DOMAIN_PROJECTS:-projects.sovereign.local}`)"
      - "traefik.http.routers.openproject.entrypoints=websecure"
      - "traefik.http.routers.openproject.tls.certresolver=le"
      - "traefik.http.services.openproject.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health_checks/default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── 5. NEXTCLOUD (End-to-End Encrypted File Cloud) ───
  nextcloud:
    image: nextcloud:stable-apache
    container_name: sovereign_nextcloud
    restart: unless-stopped
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${DOMAIN_NEXTCLOUD:-cloud.sovereign.local}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=${DOMAIN_NEXTCLOUD:-cloud.sovereign.local}
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - sovereign_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${DOMAIN_NEXTCLOUD:-cloud.sovereign.local}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=le"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.nextcloud-headers.headers.forceSTSHeader=true"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-headers"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 6. VAULTWARDEN (Self-Hosted Bitwarden-Compatible Password Manager) ───
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: sovereign_vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://${DOMAIN_VAULT:-vault.sovereign.local}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      - INVITATIONS_ALLOWED=true
      - LOG_LEVEL=warn
      - EXTENDED_LOGGING=true
      - SMTP_HOST=${SMTP_HOST:-smtp.sovereign.local}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-vault@sovereign.local}
    volumes:
      - vaultwarden_data:/data
    networks:
      - sovereign_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault.rule=Host(`${DOMAIN_VAULT:-vault.sovereign.local}`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls.certresolver=le"
      - "traefik.http.services.vault.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 7. PROMETHEUS (Metrics Collection) ───
  prometheus:
    image: prom/prometheus:latest
    container_name: sovereign_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - sovereign_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`${DOMAIN_PROMETHEUS:-metrics.sovereign.local}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=le"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=traefik-auth"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 8. GRAFANA (Metrics Dashboards) ───
  grafana:
    image: grafana/grafana:latest
    container_name: sovereign_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${DOMAIN_GRAFANA:-grafana.sovereign.local}
      - GF_SERVER_DOMAIN=${DOMAIN_GRAFANA:-grafana.sovereign.local}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - sovereign_net
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${DOMAIN_GRAFANA:-grafana.sovereign.local}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 9. CADVISOR (Container + GPU Resource Metrics) ───
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sovereign_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - sovereign_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 10. NODE EXPORTER (Host Hardware Metrics) ───
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sovereign_node_exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - sovereign_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  traefik_certs:
  ollama_data:
  webui_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  openproject_data:
  nextcloud_data:
  vaultwarden_data:
  prometheus_data:
  grafana_data:
