# LoRa / Meshtastic gateway (standalone; not part of setup.sh).
#   docker compose -f software/mesh/lora/docker-compose.lora.yml up -d
#
# This is its own Compose project ("lora"), so it joins the core stack's network
# as an external network. If the core stack runs under a project name other than
# the default "software", set SOVEREIGN_NET_NAME=<project>_sovereign_net.
services:
  lora-gateway:
    image: python:3.11-alpine
    container_name: sovereign_lora_gateway
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app:ro
    # meshtastic_gateway.py does not open the serial port yet (it only logs a
    # heartbeat), but the container will not start unless this device exists
    # on the host. Remove the mapping to run without a radio attached.
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    environment:
      - LORA_SERIAL_PORT=/dev/ttyUSB0
      - LORA_BAUD_RATE=115200
      - DTN_FALLBACK_ENABLED=true
    networks:
      - sovereign_net
    command: ["python3", "meshtastic_gateway.py"]

networks:
  sovereign_net:
    external: true
    name: ${SOVEREIGN_NET_NAME:-software_sovereign_net}
