# Power & thermal telemetry exporter overlay.
#
# Relative paths below are resolved against the Compose project directory,
# which is `software/` when this file is merged with the core stack
# (`./setup.sh --with-telemetry`). To run it standalone against a core stack that is
# already up, add the attach file, which declares the core stack's network and
# volumes as external (use the same -p <name> as the core stack if it is not the
# default "software"):
#   docker compose --project-directory software \
#     -f software/docker-compose.attach.yml -f software/telemetry/docker-compose.telemetry.yml up -d
#
# No `name:` is set on sovereign_net or on any volume key that docker-compose.yml
# also declares: merged or attached, they resolve to the core stack's own
# <project>_* objects for every project name (scripts/validate_compose.sh checks it).
networks:
  sovereign_net:

services:
  power-exporter:
    image: python:3.11-alpine
    container_name: sovereign_power_exporter
    restart: unless-stopped
    command: ["python", "/app/power_exporter.py"]
    environment:
      - EXPORTER_PORT=9101
      - SIMULATE_POWER_DATA=${SIMULATE_POWER_DATA:-true}
      # Hardware mode (SIMULATE_POWER_DATA=false): /metrics URL of the ESP32 telemetry
      # bridge, e.g. http://192.168.1.50/metrics (use the LAN IP: mDNS names do not resolve
      # in the container). Empty = no hardware source, sovereign_telemetry_source_up 0.
      - ESP32_BRIDGE_URL=${ESP32_BRIDGE_URL:-}
      - ESP32_BRIDGE_MAX_FRAME_AGE_SECONDS=${ESP32_BRIDGE_MAX_FRAME_AGE_SECONDS:-10}
      # sovereign_load_shedding_active is 1 while battery SoC is below this (shedding level 3).
      - SHEDDING_L3_SOC=${SHEDDING_L3_SOC:-20}
    volumes:
      - ./telemetry/power_exporter.py:/app/power_exporter.py:ro
    networks:
      - sovereign_net
    ports:
      - "9101:9101"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9101/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3