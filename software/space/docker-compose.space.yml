# Space Communications (RFC 9171 DTN + simplified circular-orbit pass prediction, not SGP4) overlay.
#
# Relative paths below are resolved against the Compose project directory,
# which is `software/` when this file is merged with the core stack
# (`./setup.sh --with-space`). To run it standalone against a core stack that is
# already up, add the attach file, which declares the core stack's network and
# volumes as external (use the same -p <name> as the core stack if it is not the
# default "software"):
#   docker compose --project-directory software \
#     -f software/docker-compose.attach.yml -f software/space/docker-compose.space.yml up -d
#
# No `name:` is set on sovereign_net or on any volume key that docker-compose.yml
# also declares: merged or attached, they resolve to the core stack's own
# <project>_* objects for every project name (scripts/validate_compose.sh checks it).
services:
  space-node:
    build:
      context: ./space
      dockerfile: Dockerfile
    image: sovereign/space-node:latest
    container_name: sovereign_space_node
    restart: unless-stopped
    ports:
      # SPACE_EXPORTER_PORT sets the host port only; the container always
      # listens on 9102 (healthcheck and Prometheus target depend on it).
      - "${SPACE_EXPORTER_PORT:-9102}:9102"
    environment:
      - SPACE_EXPORTER_PORT=9102
      - GROUND_STATION_LAT=${GROUND_STATION_LAT:-37.9838}
      - GROUND_STATION_LON=${GROUND_STATION_LON:-23.7275}
      - GROUND_STATION_NAME=${GROUND_STATION_NAME:-Sovereign-Ground-01}
      - DTN_DB_PATH=/var/spool/dtn/bundles.db
    volumes:
      - space_spool_data:/var/spool/dtn
    networks:
      - sovereign_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  space_spool_data:
    name: sovereign_space_spool

networks:
  sovereign_net:
