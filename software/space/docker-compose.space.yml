# Space Communications (RFC 9171 DTN + SGP4 orbital tracking) overlay.
#
# Relative paths below are resolved against the Compose project directory,
# which is `software/` when this file is merged with the core stack
# (`./setup.sh --with-space`). To run it standalone, pin the project directory:
#   docker compose --project-directory software -f software/space/docker-compose.space.yml up -d
services:
  space-node:
    build:
      context: ./space
      dockerfile: Dockerfile
    image: sovereign/space-node:latest
    container_name: sovereign_space_node
    restart: unless-stopped
    ports:
      - "${SPACE_EXPORTER_PORT:-9102}:9102"
    environment:
      - SPACE_EXPORTER_PORT=${SPACE_EXPORTER_PORT:-9102}
      - GROUND_STATION_LAT=${GROUND_STATION_LAT:-37.9838}
      - GROUND_STATION_LON=${GROUND_STATION_LON:-23.7275}
      - GROUND_STATION_NAME=${GROUND_STATION_NAME:-Sovereign-Ground-01}
      - DTN_DB_PATH=/var/spool/dtn/bundles.db
    volumes:
      - space_spool_data:/var/spool/dtn
    networks:
      - sovereign_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  space_spool_data:
    name: sovereign_space_spool

networks:
  sovereign_net:
    name: software_sovereign_net
