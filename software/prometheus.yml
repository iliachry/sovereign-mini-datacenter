# ====================================================================
# Prometheus Scrape Configuration — Sovereign Mini Datacenter
# ====================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    datacenter: 'sovereign'

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'sovereign-host'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']

  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
    metrics_path: '/metrics'

  - job_name: 'power_telemetry'
    static_configs:
      - targets: ['power-exporter:9101']

  - job_name: 'space_telemetry'
    static_configs:
      - targets: ['space-node:9102']