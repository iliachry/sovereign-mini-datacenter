# ====================================================================
# Prometheus Scrape Configuration - Sovereign Mini Datacenter
# ====================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    datacenter: 'sovereign'

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'sovereign-host'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Traefik "metrics" entrypoint (see docker-compose.yml), internal only.
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']

  # Present only with the telemetry overlay (setup.sh --with-telemetry).
  - job_name: 'power_telemetry'
    static_configs:
      - targets: ['power-exporter:9101']

  # Present only with the space overlay (setup.sh --with-space).
  - job_name: 'space_telemetry'
    static_configs:
      - targets: ['space-node:9102']

  # Example: ESP32 telemetry bridge. mDNS (*.local) names do not resolve inside
  # the Prometheus container, so use the bridge's LAN IP. Uncomment and edit.
  # - job_name: 'esp32_bridge'
  #   static_configs:
  #     - targets: ['<ESP32_BRIDGE_IP>:80']
  #   metrics_path: '/metrics'
  #   scrape_interval: 30s
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance
  #       replacement: 'esp32-telemetry-bridge'

