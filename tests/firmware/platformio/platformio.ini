; PlatformIO project used by CI (job quality-gate-firmware-validation) to
; cross-compile firmware/esp32_telemetry_bridge.ino for a real ESP32.
;
; The sketch is NOT stored here: the build step copies it to src/main.ino in a
; scratch directory, so there is exactly one copy of the firmware in the repo.
;
;   work="$(mktemp -d)" && mkdir "$work/src"
;   cp tests/firmware/platformio/platformio.ini "$work/"
;   cp firmware/esp32_telemetry_bridge.ino "$work/src/main.ino"
;   pio run -d "$work"
;
; CI caches ~/.platformio keyed on the hash of this file.

[env:esp32dev]
platform = platformio/espressif32@~8.0.0
board = esp32dev
framework = arduino
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6
